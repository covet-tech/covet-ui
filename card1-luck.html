<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>card1 luck renderer</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1440px; height: 2560px; overflow: hidden; }
    #stage { position: relative; width: 1440px; height: 2560px;
      background: linear-gradient(170deg, #fdf3ec 0%, #fbe9e2 45%, #f6d9d2 100%); }
    .txt { position: absolute; left: 0; right: 0; top: 850px;
      font-family: "Fraunces", serif; font-weight: 480; font-size: 176px; line-height: 1.12;
      color: #9d1b2d; text-align: center; letter-spacing: -0.005em; }
    .txt .hh { color: #e0455e; }
    .gbox { position: absolute; left: 50%; top: 1620px; transform: translateX(-50%); }
    .g-body { position: relative; width: 300px; height: 190px; border-radius: 30px;
      background: linear-gradient(135deg, #c81f42, #e8496b 70%, #c81f42);
      box-shadow: 0 34px 70px rgba(140, 20, 45, 0.3), inset 0 10px 22px rgba(255,255,255,0.3); }
    .g-body i { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%); width: 44px; border-radius: 8px;
      background: linear-gradient(180deg, #fdf0e8, #f8dbe2); }
    .g-cap { position: absolute; left: 50%; margin-left: -170px; width: 340px; height: 56px; border-radius: 20px; z-index: 2;
      background: linear-gradient(135deg, #c81f42, #e8496b 65%, #c81f42);
      box-shadow: 0 20px 44px rgba(140, 20, 45, 0.28), inset 0 8px 16px rgba(255,255,255,0.3); }
    .g-cap i { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%); width: 50px; border-radius: 8px;
      background: linear-gradient(180deg, #fdf0e8, #f8dbe2); }
    /* bow: loops + knot on the lid */
    .g-cap::before, .g-cap::after { content: ""; position: absolute; top: -42px; width: 88px; height: 56px;
      background: linear-gradient(135deg, #fdf0e8 20%, #f8d0da 70%, #f2b8c8);
      border-radius: 62% 38% 66% 34% / 72% 64% 36% 28%;
      box-shadow: inset 0 -12px 22px rgba(200, 31, 66, 0.3); }
    .g-cap::before { right: calc(50% - 7px); transform: rotate(-34deg); }
    .g-cap::after { left: calc(50% - 7px); transform: rotate(34deg) scaleX(-1); }
    .g-knot { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); width: 40px; height: 36px; z-index: 3;
      background: linear-gradient(135deg, #fdf0e8, #f8d0da); border-radius: 13px;
      box-shadow: inset 0 -7px 12px rgba(200, 31, 66, 0.28); }
    .heart { position: absolute; font-size: 74px; color: #e8496b; opacity: 0; }
    .spark { position: absolute; font-size: 60px; opacity: 0; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="txt" id="txt">luck looks<br>good <span class="hh">on you ♥</span></div>
    <div class="gbox" id="gb">
      <div class="g-cap" id="cap" style="top:-30px"><i></i><span class="g-knot"></span></div>
      <div class="g-body" style="margin-top:34px"><i></i></div>
    </div>
    <span class="heart" id="h1" style="left:520px;top:1560px">♥</span>
    <span class="heart" id="h2" style="left:760px;top:1520px;font-size:56px">♥</span>
    <span class="heart" id="h3" style="left:640px;top:1480px;font-size:44px;color:#f2a0b4">♥</span>
    <span class="spark" id="s1" style="left:300px;top:760px;color:#e8a94e">✨</span>
    <span class="spark" id="s2" style="right:280px;top:1240px;color:#e8a94e">✨</span>
  </div>
  <script>
    const FPS = 24;
    window.TOTAL_FRAMES = 60; /* 2.5s */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    const backOut = (x) => { const c = 2.70158; return 1 + c * Math.pow(x - 1, 3) + (c - 1) * Math.pow(x - 1, 2); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const $ = (id) => document.getElementById(id);
    window.setFrame = function (f) {
      const t = f / FPS;
      const q = backOut(P(t, 0.04, 0.55));
      $("txt").style.transform = `scale(${lerp(0.5, 1, q)})`;
      $("txt").style.opacity = P(t, 0.04, 0.3);
      const g = backOut(P(t, 0.5, 1.0));
      $("gb").style.transform = `translateX(-50%) translateY(${lerp(140, 0, g)}px) scale(${lerp(0.3, 1, g)})`;
      $("gb").style.opacity = P(t, 0.5, 0.75);
      const pop = P(t, 1.1, 1.5);
      $("cap").style.transform = `translateY(${lerp(0, -90, backOut(pop))}px) rotate(${lerp(0, -11, pop)}deg)`;
      [["h1", 1.25, -260, -60], ["h2", 1.35, -320, 40], ["h3", 1.45, -380, -10]].forEach(([id, d, dy, dx]) => {
        const p = P(t, d, d + 1.0);
        $(id).style.opacity = String(clamp(1.5 - p * 1.5, 0, 1) * P(t, d, d + 0.15));
        $(id).style.transform = `translate(${dx * p}px, ${dy * p}px) scale(${lerp(0.5, 1.1, p)})`;
      });
      $("s1").style.opacity = P(t, 0.7, 1.0);
      $("s2").style.opacity = P(t, 0.9, 1.2);
      $("s1").style.transform = `translateY(${lerp(16, -14, P(t, 0.7, 2.5))}px)`;
      $("s2").style.transform = `translateY(${lerp(16, -20, P(t, 0.9, 2.5))}px)`;
    };
    setFrame(0);
  </script>
</body>
</html>
