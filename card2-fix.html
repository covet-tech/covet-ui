<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>card2 fix renderer</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1440px; height: 2560px; overflow: hidden; }
    #stage { position: relative; width: 1440px; height: 2560px;
      background: linear-gradient(170deg, #fdf3ec 0%, #fbe9e2 45%, #f6d9d2 100%); }
    .txt { position: absolute; left: 0; right: 0; top: 830px;
      font-family: "Fraunces", serif; font-weight: 480; font-size: 172px; line-height: 1.12;
      color: #9d1b2d; text-align: center; letter-spacing: -0.005em; }
    .sticker { position: absolute; background: #fff; border-radius: 34px; padding: 26px;
      box-shadow: 0 18px 44px rgba(120, 30, 40, 0.18); }
    .sticker svg { display: block; }
    .check { position: absolute; right: -16px; top: -16px; width: 56px; height: 56px; border-radius: 50%;
      background: #eeb020; color: #fff; font-size: 32px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif; box-shadow: 0 8px 18px rgba(160, 110, 10, 0.35); }
    .spark { position: absolute; font-size: 56px; }
    .coin { position: absolute; width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #f5d76e, #d9a83c); box-shadow: 0 6px 14px rgba(160,110,10,0.3); }
  </style>
</head>
<body>
  <div id="stage">
    <span class="coin" style="left:200px;top:340px"></span>
    <span class="coin" style="right:260px;top:470px;width:26px;height:26px"></span>
    <span class="coin" style="left:340px;top:1980px;width:28px;height:28px"></span>
    <span class="spark" id="sp1" style="left:190px;top:700px;color:#e8a94e">✨</span>
    <span class="spark" id="sp2" style="right:200px;top:1350px;color:#ff5f85">♥</span>
    <div class="txt" id="txt">real<br>designer.<br>never a dupe.</div>
    <div class="sticker" id="st1" style="left:280px;top:1620px;transform:rotate(-7deg)">
      <svg width="150" height="190" viewBox="0 0 80 96" fill="none">
        <rect x="30" y="4" width="20" height="12" rx="3" fill="#9d1b2d"/>
        <rect x="18" y="20" width="44" height="70" rx="8" fill="#f2b8c6"/>
        <rect x="24" y="28" width="8" height="54" rx="4" fill="#fff" opacity="0.5"/>
      </svg>
      <span class="check">✓</span>
    </div>
    <div class="sticker" id="st2" style="left:610px;top:1700px;transform:rotate(3deg)">
      <svg width="190" height="150" viewBox="0 0 100 78" fill="none">
        <path d="M32 26 Q32 8 50 8 Q68 8 68 26" stroke="#9d1b2d" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="12" y="26" width="76" height="46" rx="12" fill="#f6c9d4"/>
        <path d="M12 44 L12 38 Q12 26 24 26 L76 26 Q88 26 88 38 L88 44 Q88 52 76 52 L24 52 Q12 52 12 44 Z" fill="#e8a0b8" opacity="0.6"/>
        <circle cx="50" cy="52" r="7" fill="none" stroke="#d4af6a" stroke-width="3.4"/>
      </svg>
      <span class="check">✓</span>
    </div>
    <div class="sticker" id="st3" style="left:960px;top:1640px;transform:rotate(8deg)">
      <svg width="180" height="120" viewBox="0 0 80 36" fill="none">
        <path d="M2 10 C10 4 27 5 33 11 C35 13 35 17 34 20 C32 27 25 31 17 31 C9 31 3 26 2 17 Z" fill="#c22a45"/>
        <path d="M78 10 C70 4 53 5 47 11 C45 13 45 17 46 20 C48 27 55 31 63 31 C71 31 77 26 78 17 Z" fill="#c22a45"/>
        <path d="M35 13 Q40 9 45 13" stroke="#c22a45" stroke-width="2.6" fill="none"/>
      </svg>
      <span class="check">✓</span>
    </div>
  </div>
  <script>
    const FPS = 24;
    window.TOTAL_FRAMES = 60; /* 2.5s */
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    const backOut = (x) => { const c = 2.70158; return 1 + c * Math.pow(x - 1, 3) + (c - 1) * Math.pow(x - 1, 2); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const $ = (id) => document.getElementById(id);
    window.setFrame = function (f) {
      const t = f / FPS;
      const q = backOut(P(t, 0.04, 0.5));
      $("txt").style.transform = `scale(${lerp(0.55, 1, q)})`;
      $("txt").style.opacity = P(t, 0.04, 0.28);
      [["st1", 0.45, -7], ["st2", 0.6, 3], ["st3", 0.75, 8]].forEach(([id, d, rot]) => {
        const s = backOut(P(t, d, d + 0.45));
        $(id).style.transform = `rotate(${rot}deg) scale(${lerp(0.2, 1, s)}) translateY(${lerp(60, 0, s)}px)`;
        $(id).style.opacity = P(t, d, d + 0.2);
      });
      $("sp1").style.opacity = P(t, 0.9, 1.2);
      $("sp2").style.opacity = P(t, 1.05, 1.35);
      $("sp1").style.transform = `translateY(${lerp(20, -16, P(t, 0.9, 2.5))}px)`;
      $("sp2").style.transform = `translateY(${lerp(20, -22, P(t, 1.05, 2.5))}px)`;
    };
    setFrame(0);
  </script>
</body>
</html>
