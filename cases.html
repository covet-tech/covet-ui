<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boxes · Covet</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=269" />
  <style>
    .sort-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .sort-row .micro { margin-right: 6px; }
    .fchip {
      padding: 9px 20px;
      border-radius: 100px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.35s var(--spring);
    }
    .fchip:hover { transform: translateY(-2px); border-color: var(--gold); color: var(--gold); }
    .fchip.on {
      background: linear-gradient(120deg, var(--gold), var(--gold-bright));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px rgba(224, 45, 86, 0.25);
    }
    .search-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .search-input {
      flex: 0 1 420px;
      padding: 14px 22px;
      border-radius: 100px;
      border: 1px solid var(--line);
      background: #fff;
      font-family: inherit; font-size: 14px;
      color: var(--ink);
      outline: none;
      box-shadow: var(--shadow-soft);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
    .pager { display: flex; gap: 8px; justify-content: center; margin-top: 34px; }
  </style>
</head>
<body data-page="cases">
  <header class="site-head"></header>

  <main>
    <section class="page-head">
      <div class="shell">
        <span class="eyebrow">The boxes</span>
        <h1 class="display">What are we <em>feeling</em> today?</h1>
        <p class="lede">Real pieces only. Pick a box, watch the reveal, and one of them ships to you. Or sell it back on the spot.</p>
      </div>
    </section>

    <section class="section" style="padding-top:24px">
      <div class="shell">
        <div class="search-row">
          <input class="search-input" id="boxSearch" type="search" placeholder="Search boxes, brands, pieces…" oninput="gridPage = 1; renderGrid()" />
          <span class="micro" id="boxCount"></span>
        </div>
        <div class="sort-row" id="sortRow">
          <span class="micro">Sort</span>
          <button class="fchip on" data-sort="featured">Our picks</button>
          <button class="fchip" data-sort="number">Box number</button>
          <button class="fchip" data-sort="low">Price: low to high</button>
          <button class="fchip" data-sort="high">Price: high to low</button>
          <button class="fchip" data-sort="top">Biggest top pull</button>
        </div>
        <div class="case-grid" id="allCases"></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>
  </main>

  <footer class="site-foot"></footer>

  <script src="js/data.js?v=269"></script>
  <script src="js/art.js?v=269"></script>
  <script src="js/app.js?v=269"></script>
  <script>
    const FEATURED_ORDER = ["sunnies", "richmom", "handbag", "beauty", "heiress", "vanillagirl", "oldmoney", "archive"];
    const PER_PAGE = 16;
    let sortMode = "featured";
    let gridPage = 1;
    function renderGrid() {
      const q = (document.getElementById("boxSearch").value || "").trim().toLowerCase();
      let list = [...CASES];
      if (sortMode === "featured") {
        const rank = (c) => { const i = FEATURED_ORDER.indexOf(c.id); return i === -1 ? 100 + CASES.indexOf(c) : i; };
        list.sort((a, b) => rank(a) - rank(b));
      }
      /* "number" keeps catalog order: numerals ascend with the array */
      if (sortMode === "low") list.sort((a, b) => a.price - b.price);
      if (sortMode === "high") list.sort((a, b) => b.price - a.price);
      if (sortMode === "top") list.sort((a, b) => Math.max(...b.drops.map((d) => d.value)) - Math.max(...a.drops.map((d) => d.value)));
      if (q) list = list.filter((c) =>
        (c.name + " " + c.short + " " + c.blurb + " " + c.drops.map((d) => d.house + " " + d.name).join(" ")).toLowerCase().includes(q));
      const wish = `
        <a class="case-card" href="build.html" style="--tint:#e0417c">
          <div class="cc-top"><span class="case-num">No. XVIII</span><span class="cc-price">Your call</span></div>
          <h3>Your Wishlist</h3>
          <p class="cc-get">Pick your pieces, pick your chances. One ships.</p>
          <div class="case-bottles" style="color:#e0417c;margin:6px 0 16px">${bottleSVG(20)}${bottleSVG(20)}${bottleSVG(20)}</div>
          <div class="cc-vals"><span>You pick the odds</span><span><b data-wishcount>0</b> hearted</span></div>
          <span class="btn btn-ghost" style="width:100%;margin-top:16px;padding-left:12px;padding-right:12px;white-space:nowrap">Open my wishlist</span>
        </a>`;
      /* wishlist rides first; hidden while searching so results stay clean */
      const cards = (q ? [] : [wish]).concat(list.map(caseCardHTML));
      const pages = Math.max(1, Math.ceil(cards.length / PER_PAGE));
      if (gridPage > pages) gridPage = pages;
      document.getElementById("allCases").innerHTML = cards.slice((gridPage - 1) * PER_PAGE, gridPage * PER_PAGE).join("");
      document.getElementById("boxCount").textContent = q
        ? `${list.length} of ${CASES.length} boxes`
        : `${CASES.length} boxes · always growing`;
      document.getElementById("pager").innerHTML = pages <= 1 ? "" :
        `<button class="fchip" ${gridPage === 1 ? "disabled" : ""} onclick="setPage(${gridPage - 1})">‹</button>` +
        Array.from({ length: pages }, (_, i) =>
          `<button class="fchip ${gridPage === i + 1 ? "on" : ""}" onclick="setPage(${i + 1})">${i + 1}</button>`).join("") +
        `<button class="fchip" ${gridPage === pages ? "disabled" : ""} onclick="setPage(${gridPage + 1})">›</button>`;
      document.querySelectorAll("[data-wishcount]").forEach((n) => (n.textContent = getWishlist().length));
    }
    function setPage(p) {
      gridPage = p;
      renderGrid();
      document.getElementById("sortRow").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    document.addEventListener("DOMContentLoaded", () => {
      renderGrid();
      document.querySelectorAll("#sortRow .fchip").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#sortRow .fchip").forEach((x) => x.classList.toggle("on", x === b));
          sortMode = b.dataset.sort;
          gridPage = 1;
          renderGrid();
        });
      });
    });
  </script>
</body>
</html>
